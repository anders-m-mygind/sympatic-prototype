<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYMPATIC · Konsol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sym-font);font-size:var(--sym-fs-body);line-height:var(--sym-lh-body);color:var(--sym-text);background:var(--sym-page);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
select,textarea,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.app{display:flex;height:100vh;overflow:hidden}

/* ---------- sidebar ---------- */
.sidebar{margin:12px;width:216px;flex:0 0 216px;border-radius:18px;padding:12px 12px 12px;color:var(--sym-ink-text);display:flex;flex-direction:column;box-shadow:var(--sym-shadow-rail);
 background:radial-gradient(90% 26% at 50% 106%,var(--sym-ink-glow) 0%,transparent 70%),linear-gradient(178deg,var(--sym-ink-0) 0%,var(--sym-ink-1) 100%)}
.wordmark{font-family:"Inter Tight",var(--sym-font);font-weight:700;font-size:19px;letter-spacing:.14em;padding:10px 12px 18px;color:#fff}
.wordmark span{opacity:.55;font-size:10px;letter-spacing:.12em;display:block;font-family:var(--sym-font);font-weight:600;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:500;color:var(--sym-ink-text-muted)}
.nav a svg{width:16px;height:16px;flex:0 0 16px}
.nav a.active{background:var(--sym-ink-active-pill);color:#fff;font-weight:600}
.nav a .badge{margin-left:auto;background:var(--sym-primary);color:#fff;font-size:10px;font-weight:700;height:17px;min-width:17px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.nav a.active .badge{background:#fff;color:var(--sym-ink-1)}
.usercard{margin-top:auto;background:rgba(255,255,255,.08);border-radius:16px;padding:10px}
.usercard .row{display:flex;align-items:center;gap:10px}
.usercard .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--sym-primary-soft),var(--sym-ink-glow));flex:0 0 30px}
.usercard .nm{font-size:13px;font-weight:600;line-height:16px}
.usercard .rl{font-size:11px;color:var(--sym-ink-text-muted)}
.usercard select{margin-top:8px;width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:5px 8px;font-size:12px}
.usercard select option{color:var(--sym-text)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px;overflow-y:auto;padding:20px 10px 20px 8px}
.topbar{display:flex;align-items:flex-start;gap:12px}
.topbar h2{font-size:var(--sym-fs-h2);line-height:var(--sym-lh-h2);font-weight:700}
.topbar .sub{font-size:13px;color:var(--sym-text-2)}
.topbar .right{margin-left:auto;flex-shrink:0;display:flex;align-items:center;gap:8px}
.proto{white-space:nowrap;font-size:11px;font-weight:600;color:var(--sym-text-2);background:var(--sym-surface-sunken);border:1px solid var(--sym-border);border-radius:999px;padding:4px 10px}
.screens{position:relative}
.screens select{appearance:none;background:var(--sym-surface);border:1px solid var(--sym-border);border-radius:8px;padding:6px 28px 6px 10px;font-size:12px;font-weight:500;color:var(--sym-text)}
.screens:after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--sym-text-3);border-bottom:1.5px solid var(--sym-text-3);transform:translateY(-70%) rotate(45deg)}

.card{background:var(--sym-surface);border:1px solid var(--sym-border);border-radius:16px;box-shadow:var(--sym-shadow-card)}
.card .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--sym-border)}
.card .hd h3{font-size:15px;font-weight:600}
.card .hd .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card .bd{padding:16px 18px}
.label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sym-text-3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{display:flex;gap:12px;padding:16px 18px}
.stat .ico{width:36px;height:36px;border-radius:10px;background:var(--sym-primary-soft);color:var(--sym-primary);display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.stat .ico svg{width:17px;height:17px}
.stat .lb{font-size:11px;color:var(--sym-text-2)}
.stat .v{font-size:21px;font-weight:700;line-height:26px}
.stat .v.txt{font-size:15px;line-height:20px;padding-top:3px}
.stat .d{font-size:11px;color:var(--sym-text-3)}
.stat .d.up{color:var(--sym-success)}.stat .d.dn{color:var(--sym-danger)}.stat .d.wn{color:var(--sym-warning)}
.stat.suppressed .v{color:var(--sym-text-3);font-size:14px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid32{display:grid;grid-template-columns:3fr 2fr;gap:16px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sym-text-3);text-align:left;padding:10px 18px;border-bottom:1px solid var(--sym-border)}
td{padding:11px 18px;border-bottom:1px solid var(--sym-border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sym-primary-softer)}
tr.sel td{background:var(--sym-primary-softer)}
td .sub,.sub{font-size:11.5px;color:var(--sym-text-3);line-height:15px}
td .who,td .b,.level em,.trend,td .chip{white-space:nowrap}
.card{overflow:hidden}.card:has(> table){overflow-x:auto}
.muted{color:var(--sym-text-3)}
.b{font-weight:600}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;line-height:16px;white-space:nowrap}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.chip.nodot:before{display:none}
.chip.primary{background:var(--sym-primary-soft);color:var(--sym-primary)}
.chip.success{background:var(--sym-success-soft);color:var(--sym-success)}
.chip.warning{background:var(--sym-warning-soft);color:var(--sym-warning)}
.chip.danger{background:var(--sym-danger-soft);color:var(--sym-danger)}
.chip.info{background:var(--sym-info-soft);color:var(--sym-info)}
.chip.neutral{background:var(--sym-surface-sunken);color:var(--sym-text-2)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--sym-border);background:var(--sym-surface);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--sym-text-2)}
.filters button.on{background:var(--sym-primary-soft);color:var(--sym-primary);border-color:var(--sym-primary-soft);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:9px 16px;font-size:13px;font-weight:600;border:1px solid transparent;transition:background .12s}
.btn.primary{background:var(--sym-primary);color:#fff}.btn.primary:hover{background:var(--sym-primary-hover)}
.btn.outline{border-color:var(--sym-border-strong);color:var(--sym-text)}.btn.outline:hover{background:var(--sym-surface-sunken)}
.btn.danger{border-color:var(--sym-danger);color:var(--sym-danger)}.btn.danger:hover{background:var(--sym-danger-soft)}
.btn.ghost{color:var(--sym-text-2)}.btn.ghost:hover{background:var(--sym-surface-sunken)}
.btn.sm{padding:5px 10px;font-size:11px;border-radius:8px}
.btn.lg{padding:12px 20px;font-size:14px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--sym-primary-soft);border-color:var(--sym-primary-soft);color:var(--sym-primary)}

.av{width:30px;height:30px;border-radius:50%;background:var(--sym-primary-soft);color:var(--sym-primary);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 30px}
.av.sm{width:24px;height:24px;font-size:10px;flex-basis:24px}
.hex{width:30px;height:33px;position:relative;flex:0 0 30px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--sym-primary);filter:drop-shadow(0 2px 4px rgba(15,110,92,.18))}
.hex:before{content:"";position:absolute;inset:0;background:var(--sym-primary);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);z-index:0}
.hex:after{content:"";position:absolute;inset:1.5px;background:#fff;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);z-index:1}
.hex span{position:relative;z-index:2}
.hex.sm{width:24px;height:26px;flex-basis:24px;font-size:9px}
.who{display:flex;align-items:center;gap:10px}

.level{display:inline-flex;gap:3px;align-items:center}
.level i{width:18px;height:6px;border-radius:3px;background:var(--sym-border)}
.level i.on{background:var(--sym-primary)}
.level i.past{background:var(--sym-primary-soft)}
.level em{font-style:normal;font-size:11.5px;color:var(--sym-text-2);margin-left:6px}

/* ---------- rail ---------- */
.rail{margin:12px 12px 12px 0;width:344px;flex:0 0 344px;display:flex}
.rail .inner{flex:1;border-radius:18px;border:1px solid var(--sym-border);background:var(--sym-surface);box-shadow:var(--sym-shadow-card);padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.rail h3{font-size:15px;font-weight:600;display:flex;align-items:center}
.rail h3 svg{margin-left:auto;width:15px;height:15px;color:var(--sym-text-3)}
.rail .sec{display:flex;flex-direction:column;gap:8px}
.rail textarea{width:100%;min-height:74px;border:1px solid var(--sym-border-strong);border-radius:12px;padding:10px 12px;font-size:13px;resize:vertical;background:var(--sym-surface)}
.rail textarea:focus,select:focus,input:focus{outline:2px solid var(--sym-primary-soft);border-color:var(--sym-primary)}
.rail .empty{color:var(--sym-text-3);font-size:13px;padding:24px 0;text-align:center;border:1px dashed var(--sym-border-strong);border-radius:12px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--sym-border)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--sym-text-2)}
.selcard{border:1.5px solid var(--sym-primary);background:var(--sym-primary-softer);border-radius:12px;padding:12px}
.evid{list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--sym-text-2)}
.evid li{padding-left:14px;position:relative}
.evid li:before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--sym-primary)}
.vgroup{display:flex;flex-direction:column;gap:6px}
.vgroup .btn{justify-content:flex-start;width:100%}
.vgroup .btn.on{outline:0}

/* ---------- conference ---------- */
.dgroup{display:flex;flex-direction:column;gap:10px}
.dgroup .gh{display:flex;align-items:center;gap:10px;padding:4px 2px}
.dgroup .gh .label{color:var(--sym-text-2)}
.dcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:14px 16px;cursor:pointer;border-left:3px solid transparent;transition:background .1s}
.dcard:hover{background:var(--sym-primary-softer)}
.dcard.sel{background:var(--sym-primary-softer);border-left-color:var(--sym-primary)}
.dcard.hard{border-left-color:var(--sym-danger)}
.dcard.hard.sel{background:var(--sym-danger-soft)}
.dcard .t{font-size:13.5px;font-weight:600}
.dcard .meta{font-size:11.5px;color:var(--sym-text-3);margin-top:1px}
.dcard .prop{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.dcard .prop .conf{color:var(--sym-text-3);font-size:11.5px}
.dcard .evid{margin-top:8px}
.dcard .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dcard.signed{opacity:.55}
.dcard.signed .t:after{content:" · signeret";font-weight:500;color:var(--sym-success)}
.hardbanner svg{width:16px;height:16px;flex:0 0 16px}
.hardbanner{border:1px solid var(--sym-danger);background:var(--sym-danger-soft);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--sym-danger);display:flex;gap:10px;align-items:center}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:14px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1.5px;background:var(--sym-border-strong)}
.tl .it{position:relative}
.tl .it:before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--sym-surface);border:1.5px solid var(--sym-primary)}
.tl .it.d:before{background:var(--sym-primary)}
.tl .it.h:before{border-color:var(--sym-danger);background:var(--sym-danger)}
.tl .it .w{font-size:11px;color:var(--sym-text-3)}
.tl .it .tt{font-size:13px;font-weight:600}
.tl .it .tx{font-size:12.5px;color:var(--sym-text-2)}
.chk{display:flex;flex-direction:column;gap:6px;font-size:13px}
.chk label{display:flex;gap:10px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--sym-primary);width:15px;height:15px}
.audnote{margin-top:10px;border:1px solid var(--sym-border);background:var(--sym-surface-sunken);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--sym-text-2)}
.raw{margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:12.5px}
.raw span:nth-child(even){font-weight:600;text-align:right}

/* ---------- messages ---------- */
.threads{display:grid;grid-template-columns:260px 1fr;min-height:520px}
.tlist{border-right:1px solid var(--sym-border)}
.tlist .ti{display:flex;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--sym-border)}
.tlist .ti.sel,.tlist .ti:hover{background:var(--sym-primary-softer)}
.tlist .ti .n{font-size:13px;font-weight:600}
.tlist .ti .p{font-size:11.5px;color:var(--sym-text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.msgs{display:flex;flex-direction:column;gap:10px;padding:16px}
.msg{display:flex;gap:10px;max-width:78%}
.msg .bub{background:var(--sym-surface-sunken);border-radius:12px;padding:8px 12px;font-size:13px}
.msg .wh{font-size:10.5px;color:var(--sym-text-3);margin-bottom:2px}
.msg.person{align-self:flex-end;flex-direction:row-reverse}
.msg.person .bub{background:var(--sym-primary-soft);color:var(--sym-text)}
.msg.draft .bub{background:var(--sym-surface);border:1.5px dashed var(--sym-primary);}
.msg.draft .acts{display:flex;gap:6px;margin-top:8px}
.msg.clinician .bub{background:var(--sym-surface);border:1px solid var(--sym-border)}

/* ---------- schedule ---------- */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.day{border:1px solid var(--sym-border);border-radius:12px;min-height:280px;padding:10px}
.day .dn{font-size:11px;font-weight:700;color:var(--sym-text-3);text-transform:uppercase;letter-spacing:.05em}
.day .dd{font-size:18px;font-weight:700;margin-bottom:8px}
.sess{background:var(--sym-primary-soft);border-left:3px solid var(--sym-primary);border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:6px;cursor:pointer}
.sess .tm{font-weight:700;font-size:11px}
.sess.conf{background:var(--sym-surface-sunken);border-left-color:var(--sym-text-3)}

/* ---------- forms ---------- */
.form{display:flex;flex-direction:column;gap:12px;max-width:560px}
.form label{font-size:12px;font-weight:600;color:var(--sym-text-2);display:flex;flex-direction:column;gap:5px}
.form input,.form select,.form textarea{border:1px solid var(--sym-border-strong);border-radius:10px;padding:9px 12px;font-size:13px;background:var(--sym-surface)}
.form textarea{min-height:90px}
.notice{border:1px solid var(--sym-info);background:var(--sym-info-soft);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--sym-text)}
.notice.warn{border-color:var(--sym-warning);background:var(--sym-warning-soft)}
.pill-list{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:11px;color:var(--sym-text-2);align-items:center}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.searchbox{border:1px solid var(--sym-border-strong);border-radius:10px;padding:7px 12px;font-size:13px;width:280px;background:var(--sym-surface)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.toggle i{width:30px;height:17px;border-radius:999px;background:var(--sym-border-strong);position:relative;transition:background .12s}
.toggle i:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .12s}
.toggle.on i{background:var(--sym-primary)}.toggle.on i:after{left:15px}
.mods{display:flex;flex-direction:column;gap:8px}
.mod{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 14px;border:1px solid var(--sym-border);border-radius:12px;cursor:pointer}
.mod:hover,.mod.sel{background:var(--sym-primary-softer);border-color:var(--sym-primary-soft)}
.mod .t{font-size:13px;font-weight:600}
.mod .s{font-size:11.5px;color:var(--sym-text-3)}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rules .col{border:1px solid var(--sym-border);border-radius:12px;padding:12px 14px}
.rules ul{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12.5px;margin-top:8px}
.rules li{padding-left:16px;position:relative}
.rules .may li:before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--sym-success)}
.rules .must li:before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:2px;background:var(--sym-danger)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--sym-ink-1);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;box-shadow:var(--sym-shadow-pop);opacity:0;transition:all .18s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--sym-font);font-size:10px;fill:var(--sym-text-3)}
.mini{width:70px;height:22px}
.trend{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.trend.up{color:var(--sym-danger)}.trend.down{color:var(--sym-success)}.trend.flat{color:var(--sym-text-3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.bar{height:8px;border-radius:4px;background:var(--sym-border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sym-primary);border-radius:4px}
.versions{display:flex;flex-direction:column;gap:8px}
.ver{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--sym-border);border-radius:12px;font-size:13px}
.ver .code{display:block;margin-top:3px}
.ver.live{border-color:var(--sym-primary-soft);background:var(--sym-primary-softer)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--sym-text-2)}
.h3{font-size:13.5px;font-weight:600;margin-bottom:6px}
.p{font-size:13px;color:var(--sym-text-2)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="wordmark">SYMPATIC<span>KONSOL</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="usercard">
      <div class="row"><div class="av"></div><div><div class="nm" id="uname">Mette Kjær</div><div class="rl" id="urole">Psykolog · Encounter</div></div></div>
      <select id="role" aria-label="Rolle"><option value="behandler">Behandler</option><option value="firma">Firma</option><option value="kunde">Kunde</option><option value="admin">Admin</option></select>
    </div>
  </aside>
  <main class="main" id="main"></main>
  <aside class="rail"><div class="inner" id="rail"></div></aside>
</div>
<div class="toast" id="toast"></div>

<script src="../shared/data.js"></script>
<script>
/* ============ icons (lucide-style, inline) ============ */

/* SVG line chart: series [{v:[..],color}], labels */
function lineChart(series,labels,opt={}){
  const W=opt.w||600,H=opt.h||180,pl=28,pr=10,pt=12,pb=22;
  const all=series.flatMap(s=>s.v.filter(x=>x!=null));
  let mn=opt.min!=null?opt.min:Math.min(...all),mx=opt.max!=null?opt.max:Math.max(...all);
  if(mx===mn){mx+=1;mn-=1}
  const n=labels.length,x=i=>pl+i*(W-pl-pr)/(n-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let g="";const ticks=4;for(let k=0;k<=ticks;k++){const v=mn+(mx-mn)*k/ticks,yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--sym-border)"/><text x="${pl-6}" y="${yy+3}" text-anchor="end">${Number.isInteger(mx-mn)?Math.round(v):v.toFixed(1)}</text>`;}
  let bands="";if(opt.bands){opt.bands.forEach(b=>{bands+=`<rect x="${x(b.from)}" y="${pt}" width="${x(b.to)-x(b.from)}" height="${H-pt-pb}" fill="${b.color}" opacity="${b.opacity||.5}"/>`;});}
  let paths="";series.forEach(s=>{const pts=s.v.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    if(s.area){const id="g"+Math.random().toString(36).slice(2,7);paths+=`<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".16"/><stop offset="1" stop-color="${s.color}" stop-opacity=".02"/></linearGradient></defs><path d="${d} L${pts[pts.length-1][0]} ${H-pb} L${pts[0][0]} ${H-pb} Z" fill="url(#${id})"/>`;}
    paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;pts.forEach(p=>paths+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff" stroke="${s.color}" stroke-width="1.5"/>`);});
  const lab=labels.map((l,i)=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${l}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${bands}${g}${paths}${lab}</svg>`;
}
function spark(v,color){const W=70,H=22,mn=Math.min(...v),mx=Math.max(...v)||1;const x=i=>2+i*(W-4)/(v.length-1),y=a=>2+(H-4)*(1-(a-mn)/((mx-mn)||1));return `<svg class="mini" viewBox="0 0 ${W} ${H}"><path d="${v.map((a,i)=>(i?"L":"M")+x(i)+" "+y(a)).join(" ")}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;}
function barChart(items,opt={}){const W=opt.w||600,H=opt.h||180,pl=opt.pl||110,pr=40,bh=18,gap=10,mx=Math.max(...items.map(i=>i.v||0))||1;const rows=items.map((it,k)=>{const y=12+k*(bh+gap);if(it.v==null)return `<text x="${pl-8}" y="${y+13}" text-anchor="end" style="fill:var(--sym-text)">${it.l}</text><rect x="${pl}" y="${y}" width="${W-pl-pr}" height="${bh}" rx="4" fill="var(--sym-surface-sunken)"/><text x="${pl+8}" y="${y+13}">n under 5 · skjult</text>`;const w=(W-pl-pr)*it.v/mx;return `<text x="${pl-8}" y="${y+13}" text-anchor="end" style="fill:var(--sym-text)">${it.l}</text><rect x="${pl}" y="${y}" width="${w}" height="${bh}" rx="4" fill="${it.c||"var(--sym-primary)"}"/><text x="${pl+w+6}" y="${y+13}" style="fill:var(--sym-text)">${it.t||it.v}</text>`;}).join("");const h=12+items.length*(bh+gap);return `<svg class="chart" viewBox="0 0 ${W} ${h}">${rows}</svg>`;}

/* ============ BEHANDLER ============ */
function vConference(){
  const open=SYM.decisions.filter(d=>!state.signed[d.id]),hard=open.filter(d=>d.kind==="hard_stop").length;
  const kinds=["hard_stop","triage","placement","step_change","discharge"];
  const f=state.filter;
  const counts=kinds.map(k=>[k,SYM.decisions.filter(d=>d.kind===k&&!state.signed[d.id]).length]);
  const chips=`<div class="filters"><button class="${f==="alle"?"on":""}" data-f="alle">Alle ${open.length}</button>${counts.map(([k,n])=>`<button class="${f===k?"on":""}" data-f="${k}">${SYM.kindLabel[k]} ${n}</button>`).join("")}</div>`;
  const groups=kinds.filter(k=>f==="alle"||f===k).map(k=>{
    const ds=SYM.decisions.filter(d=>d.kind===k);if(!ds.length)return "";
    const batch=k==="triage"?`<button class="btn sm outline" data-batch="1">Godkend alle AI-forslag (${ds.filter(d=>!state.signed[d.id]).length})</button>`:"";
    return `<div class="dgroup"><div class="gh"><span class="label">${SYM.kindLabel[k]}</span><span class="muted" style="font-size:11.5px">${k==="hard_stop"?"AI-vurdering sprunget over. Kan ikke batch-godkendes.":k==="triage"?"Indikation for risiko på erhvervsevne?":k==="placement"?"Startniveau på trappen":k==="step_change"?"Monitorering foreslår skift":"Afslutning af forløb"}</span><span style="margin-left:auto">${batch}</span></div><div class="card">${ds.map(dcard).join("")}</div></div>`;
  }).join("");
  return topbar("Morgenkonference","Beslutninger der afventer klinisk signatur · "+new Date().toLocaleDateString("da-DK",{weekday:"long",day:"numeric",month:"long"}))
    +(hard?`<div class="hardbanner">${I.alert}<span><b>${hard} hard stop</b> · kræver klinisk kontakt i dag. Går uden om AI-vurdering.</span></div>`:"")
    +chips+groups;
}
function dcard(d){
  const c=C(d.case),p=P(c.person),signed=state.signed[d.id];const sel=state.selDecision===d.id;
  const prop=d.kind==="hard_stop"?`<span class="chip danger">Hard stop</span><span>${esc(d.note)}</span>`
    :`<span class="muted">AI foreslår</span> <span class="chip ${propTone(d)}">${propLabel(d)}</span><span class="conf">sikkerhed ${Math.round(d.confidence*100)} %</span>`;
  return `<div class="dcard ${d.kind==="hard_stop"?"hard":""} ${sel?"sel":""} ${signed?"signed":""}" data-d="${d.id}">
    ${av(p)}
    <div><div class="t">${esc(p.name)} <span class="muted" style="font-weight:500">· ${c.id}</span></div>
      <div class="meta">${srcLabel[c.source]} · ${SYM.stateLabel[c.state]}${c.level?" · "+SYM.levelLabel[c.level]:""} · oprettet ${fmtDT(d.created)}</div>
      <div class="prop">${prop}</div>
      <ul class="evid">${d.evidence.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>
    <div class="right">${signed?`<span class="chip success">Signeret · ${signed}</span>`:`<span class="chip neutral nodot">${d.id}</span>`}</div></div>`;
}
function propLabel(d){if(d.kind==="triage")return d.ai==="indicated"?"Indikation":"Ingen indikation";if(d.kind==="placement")return "Start: "+SYM.levelLabel[d.ai];if(d.kind==="step_change")return d.ai.replace("guided","Guidet").replace("human","Menneskelig").replace("blended","Blended");if(d.kind==="discharge")return "Stabiliseret · afslut";return d.ai;}
function propTone(d){if(d.kind==="triage")return d.ai==="indicated"?"warning":"neutral";if(d.kind==="discharge")return "success";return "primary";}
function railConference(){
  const d=SYM.decisions.find(x=>x.id===state.selDecision);
  if(!d)return railHead("Din beslutning")+`<div class="empty">Vælg en beslutning i køen.<br>Hard stops kan ikke signeres uden kontakt.</div><div class="sec"><span class="label">I dag</span><div class="kv"><span>Åbne</span><b>${SYM.decisions.filter(x=>!state.signed[x.id]).length}</b></div><div class="kv"><span>Signeret af dig</span><b>${Object.keys(state.signed).length}</b></div><div class="kv"><span>Model</span><span class="code">triage-v0.3 · prompt 2026-09-12</span></div></div>`;
  const c=C(d.case),p=P(c.person),signed=state.signed[d.id];
  const v=state.verdict[d.id]||"";
  const isHard=d.kind==="hard_stop";
  const levels=["guided","human","blended"];
  const verdicts=isHard?[["contact","Kontakt person nu"],["escalate","Eskalér til klinik"]]:[["approve","Godkend AI-forslag"],["change","Ændr niveau"],["back","Send tilbage til screening"]];
  return railHead("Din beslutning")+`
    <div class="selcard"><div class="who">${av(p)}<div><div class="b" style="font-size:13.5px">${esc(p.name)}</div><div class="sub">${c.id} · ${SYM.kindLabel[d.kind]} · ${d.id}</div></div></div></div>
    ${signed?`<div class="notice">Signeret ${signed} af Mette Kjær. Beslutningen er låst og logget.</div><a class="btn outline" href="#/case/${c.id}">Åbn forløb</a>`:`
    <div class="sec"><span class="label">Verdikt</span><div class="vgroup">${verdicts.map(([k,l])=>`<button class="btn ${v===k?"on":"outline"}" data-v="${k}">${v===k?I.check:""}${l}</button>`).join("")}
    ${v==="change"?`<select id="lvl" style="border:1px solid var(--sym-border-strong);border-radius:10px;padding:8px 10px;font-size:13px">${levels.map(l=>`<option value="${l}">${SYM.levelLabel[l]}</option>`).join("")}</select>`:""}</div></div>
    <div class="sec"><span class="label">Begrundelse ${isHard?"(påkrævet)":"(valgfri, logges)"}</span><textarea id="reason" placeholder="Kort klinisk begrundelse…">${esc(state.reason[d.id]||"")}</textarea></div>
    <button class="btn primary lg" id="sign" ${!v?"disabled":""}>Signér som Mette Kjær</button>
    <div class="sub" style="text-align:center">Signatur skriver en beslutningspost. AI-forslag, modelversion og evidens gemmes sammen med dit verdikt.</div>

function render(){
  let h=location.hash||"#/conference";if(!h.startsWith("#/"))h="#/conference";
  const [path,qs]=h.slice(2).split("?");const [key,arg]=path.split("/");if(qs){const m=qs.match(/sel=([^&]+)/);if(m)state.selDecision=m[1];}
  const v=VIEWS[key]||VIEWS.conference;
  const role=ROUTE_ROLE[key]||"behandler";if(role!==state.role)state.role=role;
  renderNav();
  $("#main").innerHTML=v[0](arg);$("#rail").innerHTML=v[1](arg);
  $("#main").scrollTop=0;
}
window.addEventListener("hashchange",render);
$("#role").addEventListener("change",e=>{state.role=e.target.value;location.hash="#/"+NAV[state.role][0][0];});

/* delegated clicks */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-d],[data-f],[data-batch],[data-v],#sign,[data-href],#raw,[data-thread],[data-send],[data-edit],[data-discard],[data-sess],[data-mod],[data-toast],#refCreate,#refReset,#campToggle,[data-tenant],[data-sel]");
  if(!t)return;
  if(t.dataset.toast){toast(t.dataset.toast);return;}
  if(t.dataset.sel){state.selDecision=t.dataset.sel;}
  if(t.dataset.d){state.selDecision=t.dataset.d;render();return;}
  if(t.dataset.f){state.filter=t.dataset.f;render();return;}
  if(t.dataset.batch){const ts=SYM.decisions.filter(d=>d.kind==="triage"&&!state.signed[d.id]);const now=new Date().toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"});ts.forEach(d=>{state.signed[d.id]=now;state.verdict[d.id]="approve";});toast(`${ts.length} triage-forslag signeret · logget`);render();return;}
  if(t.dataset.v){state.verdict[state.selDecision]=t.dataset.v;const r=$("#reason");if(r)state.reason[state.selDecision]=r.value;render();return;}
  if(t.id==="sign"){const d=SYM.decisions.find(x=>x.id===state.selDecision);const r=$("#reason");if(r)state.reason[d.id]=r.value;if(d.kind==="hard_stop"&&!(state.reason[d.id]||"").trim()){toast("Hard stop kræver begrundelse");return;}state.signed[d.id]=new Date().toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"});const c=C(d.case);if(state.verdict[d.id]==="approve"){if(d.kind==="triage"){c.state=d.ai==="indicated"?"indicated":"no_indication";}if(d.kind==="placement"){c.state="in_care";c.level=d.ai;}if(d.kind==="step_change"){c.level=d.ai.split(" → ")[1];}if(d.kind==="discharge"){c.state="stabilised";}}if(state.verdict[d.id]==="change"){const l=$("#lvl");if(l){c.level=l.value;c.state="in_care";}}if(state.verdict[d.id]==="back"){c.state="screening";}if(state.verdict[d.id]==="escalate"){c.state="escalated";}toast(`${d.id} signeret · beslutningspost skrevet`);render();return;}
  if(t.dataset.href){location.hash=t.dataset.href;return;}
  if(t.id==="raw"){const id=location.hash.split("/")[2];state.rawShown[id]=!state.rawShown[id];if(state.rawShown[id])toast("Læsning logget i audit");render();return;}
  if(t.dataset.thread){state.selThread=t.dataset.thread;render();return;}
  if(t.dataset.send){state.drafts[state.selThread]=false;const c=C(state.selThread);SYM.thread.push({who:"clinician",at:"Nu",text:"Hej Sofie, tak for at du delte det med søvnen. Vi bytter dagens aktivitetsplan ud med en kort søvnøvelse. Jeg følger med."});toast("Sendt som Mette Kjær · AI-udkast markeret som redigeret");render();return;}
  if(t.dataset.edit){toast("Udkast åbnet til redigering (prototype)");return;}
  if(t.dataset.discard){state.drafts[state.selThread]=false;toast("Udkast kasseret");render();return;}
  if(t.dataset.sess){state.selSess=t.dataset.sess;render();return;}
  if(t.dataset.mod!=null){state.selMod=+t.dataset.mod;render();return;}
  if(t.id==="refCreate"){state.refCreated=true;toast("Invitation sendt · personen samtykker først");render();return;}
  if(t.id==="refReset"){state.refCreated=false;render();return;}
  if(t.id==="campToggle"){state.campOn=!state.campOn;toast(state.campOn?"Kampagne aktiv":"Kampagne pauset");render();return;}
  if(t.dataset.tenant){state.selTenant=t.dataset.tenant;render();return;}
});
document.addEventListener("change",e=>{if(e.target.id==="screens"&&e.target.value){location.hash=e.target.value;}});
document.addEventListener("input",e=>{if(e.target.id==="audq"){state.audq=e.target.value;const pos=e.target.selectionStart;render();const n=$("#audq");n.focus();n.setSelectionRange(pos,pos);}if(e.target.id==="reason"){state.reason[state.selDecision]=e.target.value;}});
render();
</script>
</body>
</html>
